<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Vainer</title>
  <meta name="description" content="Live from the desk. Radio Vainer.">
  <meta name="theme-color" content="#f6efe4">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/radio.css">
</head>
<body>
  <main class="chassis">
    <header class="mast">
      <span class="brand">RV</span>
      <span class="freq">99.1</span>
      <span id="air" class="air off">Off air</span>
    </header>

    <img class="logo" src="logo.jpg" alt="">
    <h1>Radio Vainer</h1>
    <p class="tag">A one-person station.</p>
    <p id="now" class="now">Waiting for the studio</p>
    <canvas id="scope" class="scope" aria-hidden="true"></canvas>

    <audio id="player" playsinline></audio>
    <button id="listen" class="tune" type="button">Listen</button>

    <label class="fader">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9">
    </label>

    <p id="count" class="listeners"></p>
    <p id="note" class="note" role="status">Press listen. Sound starts when the studio is live.</p>

    <section class="chat" aria-labelledby="chat-label">
      <h2 id="chat-label">Chat</h2>
      <form id="chat-gate" class="chat-gate" autocomplete="off">
        <p class="hint">Pick a name, or use a suggested one. The studio runs the chat.</p>
        <label class="title-field chat-field">
          <span>Name</span>
          <input id="chat-name" type="text" maxlength="24" autocomplete="nickname" spellcheck="false">
        </label>
        <div class="chat-actions">
          <button class="chat-send" type="submit">Start chat</button>
          <button id="chat-suggest" class="text-btn" type="button">Suggest a name</button>
        </div>
      </form>
      <div id="chat-live" hidden>
        <p class="chat-you">Talking as <strong id="chat-you"></strong></p>
        <div id="chat-scroll" class="chat-scroll">
          <p id="chat-empty" class="chat-empty">No messages yet.</p>
          <ol id="chat-log" class="chat-log" role="log"></ol>
        </div>
        <form id="chat-form" class="chat-compose" autocomplete="off">
          <label class="sr" for="chat-text">Message</label>
          <input id="chat-text" type="text" maxlength="280" placeholder="Message" required>
          <button class="chat-send" type="submit">Send</button>
        </form>
        <button id="chat-leave" class="text-btn" type="button">Leave chat</button>
      </div>
      <p id="chat-note" class="note" role="status"></p>
    </section>
  </main>
  <script type="module" src="js/listen.js"></script>
</body>
</html>
