name: radio-vainer

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in server/.env to this computer .local name}
      PUBLIC_HOST: ${PUBLIC_HOST:-public.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - icecast
      - liquidsoap

  icecast:
    image: libretime/icecast:2.4.4
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${SOURCE_PASSWORD:-changeme}
      ICECAST_RELAY_PASSWORD: ${SOURCE_PASSWORD:-changeme}
      ICECAST_ADMIN_PASSWORD: ${SOURCE_PASSWORD:-changeme}
      ICECAST_HOSTNAME: localhost
      ICECAST_MAX_CLIENTS: 100
      ICECAST_MAX_SOURCES: 4

  liquidsoap:
    image: savonet/liquidsoap:v2.4.6
    restart: unless-stopped
    environment:
      SOURCE_PASSWORD: ${SOURCE_PASSWORD:-changeme}
    volumes:
      - ./radio.liq:/radio.liq:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'sed "s/__PASSWORD__/$$SOURCE_PASSWORD/g" /radio.liq > /tmp/radio.liq && exec liquidsoap /tmp/radio.liq'
    depends_on:
      - icecast

volumes:
  caddy-data:
  caddy-config:
