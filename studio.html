<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio · Radio Vainer</title>
  <meta name="theme-color" content="#f6efe4">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/radio.css">
</head>
<body>
  <main class="booth">
    <header class="mast">
      <a class="brand link" href="./">Radio Vainer</a>
    </header>

    <img class="logo logo-mark" src="logo.jpg" alt="">
    <h1>Studio</h1>

    <div class="studio-grid">
    <div class="mix">
    <div class="dock">
      <span id="air" class="air off">Off air</span>
      <p id="listeners" class="listeners"></p>
      <button id="go-live" class="tune" type="button" aria-pressed="false">Go live</button>
    </div>

    <div class="channels">
      <section class="channel">
        <button id="mic" class="channel-btn" type="button" aria-pressed="false">Microphone</button>
        <canvas id="mic-meter" class="meter" aria-hidden="true"></canvas>
        <label class="fader">
          <span>Level <b class="level">100</b></span>
          <input id="mic-gain" type="range" min="0" max="150" value="100" aria-valuetext="100">
        </label>
        <div class="fades">
          <button id="mic-fade-in" class="channel-btn fade-btn" type="button">Fade in</button>
          <button id="mic-fade-out" class="channel-btn fade-btn" type="button">Fade out</button>
        </div>
      </section>

      <section class="channel">
        <button id="music" class="channel-btn" type="button" aria-pressed="false">Music</button>
        <canvas id="music-meter" class="meter" aria-hidden="true"></canvas>
        <label class="fader">
          <span>Level <b class="level">80</b></span>
          <input id="music-gain" type="range" min="0" max="150" value="80" aria-valuetext="80">
        </label>
        <div class="fades">
          <button id="music-fade-in" class="channel-btn fade-btn" type="button">Fade in</button>
          <button id="music-fade-out" class="channel-btn fade-btn" type="button">Fade out</button>
        </div>
      </section>

      <section class="channel guest-channel">
        <button id="guest-invite" class="channel-btn" type="button" aria-pressed="false">Guest</button>
        <div id="guest-share" class="guest-share" hidden>
          <input id="guest-url" type="text" readonly value="" aria-label="Guest link">
          <button id="guest-copy" class="channel-btn" type="button">Copy</button>
        </div>
        <p id="guest-note" class="note"></p>
        <div id="guest-on" hidden>
          <p id="guest-who" class="now"></p>
          <audio id="guest-player" playsinline></audio>
          <canvas id="guest-meter" class="meter" aria-hidden="true"></canvas>
          <label class="fader">
            <span>Level <b class="level">100</b></span>
            <input id="guest-gain" type="range" min="0" max="150" value="100" aria-valuetext="100">
          </label>
          <button id="guest-drop" class="channel-btn" type="button">Drop caller</button>
        </div>
      </section>
    </div>

    <label class="title-field">
      <span>Message</span>
      <input id="message" type="text" maxlength="140" placeholder="A line for listeners" autocomplete="off">
    </label>
    <p id="status" class="note" role="status"></p>
    <a class="quiet in-booth" href="./">Open the radio</a>
    </div>

    <section class="chat" aria-labelledby="studio-chat-label">
      <h2 id="studio-chat-label">Chat</h2>
      <p id="studio-chat-note" class="note" role="status">Go live to open the chat.</p>
      <div id="studio-chat-live" hidden>
        <div class="chat-people">
          <h3>In the chat</h3>
          <div id="studio-chat-people"></div>
        </div>
        <div id="studio-chat-scroll" class="chat-scroll">
          <p id="studio-chat-empty" class="chat-empty">No messages yet.</p>
          <ol id="studio-chat-log" class="chat-log" role="log"></ol>
        </div>
        <form id="studio-chat-form" class="chat-compose" autocomplete="off">
          <label class="sr" for="studio-chat-text">Message</label>
          <input id="studio-chat-text" type="text" maxlength="280" placeholder="Message the room" required>
          <button class="chat-send" type="submit">Send</button>
        </form>
      </div>
    </section>
    </div>
  </main>
  <script type="module" src="js/studio.js"></script>
</body>
</html>
